<!DOCTYPE html>
<html>
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benchmarking NSO</title>
    <!--Chart.js JS CDN-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-adapter-luxon/1.2.1/chartjs-adapter-luxon.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-streaming/2.0.0/chartjs-plugin-streaming.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>

    <style type="text/css">
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        .chartBox {
            width: 1200px;
        }
        .header {
            position: relative;
            width: 1200px;
            margin: 12px 0 4px;
            min-height: 96px;
        }
        .header-title {
            position: absolute;
            left: 0;
            right: 600px;
            top: 0;
            color: #333;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
        }
        .toolbar {
            position: absolute;
            left: 600px;
            top: 4px;
            display: flex;
            gap: 10px;
        }
        .selected-values {
            position: absolute;
            left: 600px;
            top: 42px;
            color: #555;
            font-size: 12px;
            font-weight: normal;
            line-height: 1.35;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropbtn {
            background-color: #7e95cd;
            color: white;
            padding: 7px 12px;
            font-size: 13px;
            border: none;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.18);
            cursor: pointer;
        }
        .dropbtn:hover {
            background-color: #657fbf;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 145px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.16);
            border-radius: 5px;
            padding: 6px 0;
            z-index: 1;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .dropdown-item {
            display: block;
            color: #333;
            padding: 6px 12px;
            font-size: 13px;
            text-decoration: none;
        }
        .dropdown-item:hover {
            background-color: #f1f4fb;
        }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-title">Benchmarking NSO</div>
      <div class="toolbar">
        <div class="dropdown">
          <button class="dropbtn">Window Size</button>
          <div class="dropdown-content">
            <a class="dropdown-item" href="#" onclick="set_windowsize(10)">10 seconds</a>
            <a class="dropdown-item" href="#" onclick="set_windowsize(60)">1 minutes</a>
            <a class="dropdown-item" href="#" onclick="set_windowsize(300)">5 minutes</a>
            <a class="dropdown-item" href="#" onclick="set_windowsize(900)">15 minutes</a>
            <a class="dropdown-item" href="#" onclick="set_windowsize(1800)">30 minutes</a>
            <a class="dropdown-item" href="#" onclick="set_windowsize(3600)">1 hour</a>
            <a class="dropdown-item" href="#" onclick="set_windowsize(7200)">2 hours</a>
            <a class="dropdown-item" href="#" onclick="set_windowsize(14400)">4 hours</a>
            <a class="dropdown-item" href="#" onclick="set_windowsize(21600)">6 hours</a>
          </div>
        </div>
        <div class="dropdown">
          <button class="dropbtn">Rolling Average</button>
          <div class="dropdown-content">
            <a class="dropdown-item" href="#" onclick="set_rolling_average(3)">3 seconds</a>
            <a class="dropdown-item" href="#" onclick="set_rolling_average(5)">5 seconds</a>
            <a class="dropdown-item" href="#" onclick="set_rolling_average(10)">10 seconds</a>
            <a class="dropdown-item" href="#" onclick="set_rolling_average(15)">15 seconds</a>
            <a class="dropdown-item" href="#" onclick="set_rolling_average(30)">30 seconds</a>
            <a class="dropdown-item" href="#" onclick="set_rolling_average(60)">1 minute</a>
          </div>
        </div>
        <button id="pause-button" class="dropbtn" onclick="toggle_pause()">Pause</button>
        <button class="dropbtn" onclick="reset_view()">Reset Zoom</button>
      </div>
      <div class="selected-values">
        <div id="selected-window-size"></div>
        <div id="selected-rolling-average"></div>
        <div id="visible-range"></div>
        <div id="history-status" role="status"></div>
      </div>
    </div>
    <div class="chartBox">
      <canvas id="myChart"></canvas>
    </div>

    <script>
        var windowsize = 300;
        var rolling_average_size = 10;
        var normal_delay = 2000;
        var history_retention = 3600;
        var view_mode = 'live';
        var zoom_input_type = null;
        var metrics_by_timestamp = new Map();
        var history_request_id = 0;
        var history_timer = null;
        var chart_dirty = false;
        var average_context = 60000;
        var history_loading = false;
        var history_failed = false;
        var history_append = false;
        var history_loaded_end = 0;
        var history_prefetch = 30000;

        function delayed_live_view() {
            return view_mode === 'live' && options.scales.x.realtime.delay > history_prefetch;
        }

        function visible_bounds() {
            if (view_mode === 'paused') {
                return {start: myChart.scales.x.min, end: myChart.scales.x.max};
            }
            var end = Date.now() - options.scales.x.realtime.delay;
            return {start: end - options.scales.x.realtime.duration, end: end};
        }

        function request_history(debounce = false, append = false) {
            clearTimeout(history_timer);
            // Invalidate older responses immediately, even during a gesture debounce.
            var request_id = ++history_request_id;
            history_loading = true;
            history_failed = false;
            history_append = append;
            document.getElementById('history-status').textContent = 'Loading history...';
            history_timer = setTimeout(function() {
                var bounds = visible_bounds();
                var duration = Math.ceil((bounds.end - bounds.start) / 1000);
                var end_timestamp = Math.ceil(bounds.end / 1000);
                if (delayed_live_view()) {
                    // Buffer a little ahead so a live-panned view can keep scrolling.
                    duration = append ? history_prefetch / 1000 : duration + history_prefetch / 1000;
                    end_timestamp = Math.ceil((bounds.end + history_prefetch) / 1000);
                } else if (view_mode === 'live') {
                    duration += Math.ceil(options.scales.x.realtime.delay / 1000);
                    end_timestamp = 0;
                }
                socket.emit('start', {
                    request_id: request_id,
                    duration: Math.max(1, duration),
                    end_timestamp: end_timestamp,
                });
            }, debounce ? 150 : 0);
        }

        function format_duration(size) {
            if (size >= 3600) {
                return `${size / 3600} hour${size === 3600 ? '' : 's'}`;
            }
            if (size >= 60) {
                return `${size / 60} minute${size === 60 ? '' : 's'}`;
            }
            return `${size} seconds`;
        }

        function configured_duration() {
            return Math.min(windowsize, history_retention) * 1000;
        }

        function update_selected_values() {
            document.getElementById('selected-window-size').textContent = `Window size: ${format_duration(windowsize)}`;
            document.getElementById('selected-rolling-average').textContent = `Rolling average: ${format_duration(rolling_average_size)}`;
        }

        function update_visible_range() {
            var scale = myChart.scales.x;
            if (!Number.isFinite(scale.min) || !Number.isFinite(scale.max)) {
                return;
            }
            var start = luxon.DateTime.fromMillis(scale.min).toFormat('HH:mm:ss');
            var end = luxon.DateTime.fromMillis(scale.max).toFormat('HH:mm:ss');
            var mode = view_mode === 'paused' ? 'Paused' : 'Live';
            document.getElementById('visible-range').textContent = `${mode}: ${start}–${end}`;
        }

        function set_view_mode(mode) {
            view_mode = mode;
            options.scales.x.realtime.pause = mode === 'paused';
            document.getElementById('pause-button').textContent = mode === 'paused' ? 'Resume' : 'Pause';
        }

        function pause_chart() {
            set_view_mode('paused');
            myChart.update('none');
            update_visible_range();
            request_history();
        }

        function resume_live() {
            myChart.resetZoom('none');
            options.scales.x.realtime.duration = configured_duration();
            options.scales.x.realtime.delay = normal_delay;
            set_view_mode('live');
            myChart.update('none');
            update_visible_range();
            request_history();
        }

        function toggle_pause() {
            if (view_mode === 'paused') {
                resume_live();
            } else {
                pause_chart();
            }
        }

        function reset_view() {
            myChart.resetZoom('none');
            options.scales.x.realtime.duration = configured_duration();
            options.scales.x.realtime.delay = normal_delay;
            myChart.update('none');
            update_visible_range();
            request_history();
        }

        function clamp_view_to_history() {
            var realtime = options.scales.x.realtime;
            realtime.duration = Math.max(1000, Math.min(realtime.duration, history_retention * 1000));
            var max_delay = Math.max(0, history_retention * 1000 - realtime.duration);
            realtime.delay = Math.max(0, Math.min(realtime.delay, max_delay));
        }

        function handle_pan_complete({chart}) {
            clamp_view_to_history();
            chart.update('none');
            update_visible_range();
            request_history(true);
        }

        function handle_zoom_start({event}) {
            zoom_input_type = event.type;
        }

        function handle_zoom_complete({chart}) {
            var scale_options = chart.options.scales.x;
            if (zoom_input_type === 'mousedown' && Number.isFinite(scale_options.min) && Number.isFinite(scale_options.max)) {
                var selected_min = scale_options.min;
                var selected_max = scale_options.max;
                chart.resetZoom('none');
                options.scales.x.realtime.duration = Math.max(1000, Math.min(selected_max - selected_min, history_retention * 1000));
                options.scales.x.realtime.delay = Math.max(0, Date.now() - selected_max);
                set_view_mode('paused');
            }
            zoom_input_type = null;
            clamp_view_to_history();
            chart.update('none');
            update_visible_range();
            request_history(true);
        }

        function set_history_retention(retention) {
            retention = Number(retention);
            if (!Number.isFinite(retention) || retention < 1) {
                return;
            }
            history_retention = retention;
            options.scales.x.realtime.ttl = history_retention * 1000;
            options.plugins.zoom.limits.x.maxDelay = history_retention * 1000;
            options.plugins.zoom.limits.x.maxDuration = history_retention * 1000;
            options.scales.x.realtime.duration = Math.min(
                options.scales.x.realtime.duration, history_retention * 1000);
            clamp_view_to_history();
        }

        function set_windowsize(size) {
            windowsize = size;
            update_selected_values();
            console.log("Setting windowsize to", windowsize)
            resume_live();
        }

        function set_rolling_average(size) {
            console.log("Setting rolling average to", size)
            rolling_average_size = size;
            update_selected_values();
            rebuild_datasets();
            myChart.update('none');
        }

        const data = {
            datasets: [
            {
                lineTension: 0.0,
                label: 'OK',
                borderColor: '#7e95cd',
                backgroundColor: '#7bb6dd',
                fill: false,
            },
            {
                lineTension: 0.0,
                label: 'NOK',
                borderColor: '#ee353d',
                backgroundColor: '#ecb6dd',
                fill: false,
            },
            {
                lineTension: 0.0,
                label: 'Average',
                borderColor: '#3e951d',
                backgroundColor: '#3cb62d',
                fill: false,
            }

            ],
        };

        // options block
        var options = {
            parsing: false,
            animation: {
                duration: 0,
            },
            elements: {
                point: {radius: 0},
                line: {tension: 0},
            },
            layout: {
                padding: 0,
            },
            plugins: {
                streaming: {frameRate: 10},
                title: {
                display: false,
                align: 'center',
                font: {
                    size: 40,
                },
                text: "Benchmarking NSO",
                },
                zoom: {
                    pan: {
                        enabled: true,
                        mode: 'x',
                        modifierKey: 'ctrl',
                        onPanComplete: handle_pan_complete,
                    },
                    zoom: {
                        wheel: {
                            enabled: true,
                        },
                        drag: {
                            enabled: true,
                            threshold: 5,
                            backgroundColor: 'rgba(126, 149, 205, 0.2)',
                            borderColor: '#7e95cd',
                            borderWidth: 1,
                        },
                        pinch: {
                            enabled: true,
                        },
                        mode: 'x',
                        onZoomStart: handle_zoom_start,
                        onZoomComplete: handle_zoom_complete,
                    },
                    limits: {
                        x: {
                            minDelay: 0,
                            minDuration: 1000,
                        },
                    },
                },
            },
            scales: {
                x: {
                    type: 'realtime',
                    realtime: {
                        duration: windowsize * 1000,
                        ttl: history_retention * 1000,
                        delay: normal_delay,
                        refresh: 1000,
                        onRefresh: function() {
                            if (delayed_live_view() && !history_loading && !history_failed &&
                                visible_bounds().end + normal_delay >= history_loaded_end) {
                                request_history(false, true);
                            }
                            if (chart_dirty) {
                                trim_history();
                                rebuild_datasets();
                                chart_dirty = false;
                            }
                        },
                        pause: false
                    },
                    text: "Concurrent requests",
                },
                y: {
                display: true,
                beginAtZero: true,
                title: {
                    display: true,
                    font: {
                    size: 25,
                    },
                    text: "Requests per second",
                },
                },
            },
        };

        // config block
        const config = {
            type: 'line',
            options: options,
            data: data
        };

        // render init block
        const myChart = new Chart(
        document.getElementById('myChart'),
        config
        );

        update_selected_values();
        update_visible_range();
        setInterval(update_visible_range, 1000);

        var socket = io();

        socket.on('connect', function() {
            console.log("Connected.");
            request_history();
        });

        socket.on('disconnect', function() {
            ++history_request_id;
            clearTimeout(history_timer);
            document.getElementById('history-status').textContent = 'Disconnected; waiting to reconnect.';
        });

        function merge_metric(metric) {
            var normalized = {
                ts: Number(metric.ts),
                ok: Number(metric.ok),
                nok: Number(metric.nok),
            };
            if (!Number.isFinite(normalized.ts) || !Number.isFinite(normalized.ok) || !Number.isFinite(normalized.nok)) {
                return false;
            }
            var current = metrics_by_timestamp.get(normalized.ts);
            if (current && current.ok === normalized.ok && current.nok === normalized.nok) {
                return false;
            }
            metrics_by_timestamp.set(normalized.ts, normalized);
            return true;
        }

        function decimate_points(points, bounds) {
            var buckets = Math.max(1, Math.floor(myChart.width / 2));
            if (points.length <= buckets * 4) {
                return points;
            }
            var result = [];
            var group = [];
            var previous_bucket = -1;
            function flush() {
                if (group.length === 0) {
                    return;
                }
                var min = group.reduce((a, b) => a.y <= b.y ? a : b);
                var max = group.reduce((a, b) => a.y >= b.y ? a : b);
                Array.from(new Set([group[0], min, max, group[group.length - 1]]))
                    .sort((a, b) => a.x - b.x)
                    .forEach(point => result.push(point));
                group = [];
            }
            points.forEach(function(point) {
                var bucket = Math.min(buckets - 1, Math.max(0,
                    Math.floor((point.x - bounds.start) / Math.max(1, bounds.end - bounds.start) * buckets)));
                if (bucket !== previous_bucket) {
                    flush();
                    previous_bucket = bucket;
                }
                group.push(point);
            });
            flush();
            return result;
        }

        function rebuild_datasets() {
            var bounds = visible_bounds();
            var series = [[], [], []];
            var rolling = [];
            var sum = 0;
            Array.from(metrics_by_timestamp.values())
                .sort((a, b) => a.ts - b.ts)
                .forEach(function(metric) {
                    rolling.push(metric.ok);
                    sum += metric.ok;
                    if (rolling.length > rolling_average_size) {
                        sum -= rolling.shift();
                    }
                    // Keep boundary samples for line continuity and the live delay.
                    if (metric.ts >= bounds.start - 1000 && metric.ts <= bounds.end + normal_delay) {
                        series[0].push({x: metric.ts, y: metric.ok});
                        series[1].push({x: metric.ts, y: metric.nok});
                        series[2].push({x: metric.ts, y: sum / rolling.length});
                    }
                });
            myChart.data.datasets.forEach(function(dataset, index) {
                dataset.data = decimate_points(series[index], bounds);
            });
        }

        function trim_history() {
            var bounds = visible_bounds();
            var cutoff = Math.max(bounds.start - average_context - 1000,
                                  Date.now() - history_retention * 1000);
            var end = view_mode === 'live'
                ? Math.min(Date.now(), bounds.end + history_prefetch)
                : bounds.end + 1000;
            metrics_by_timestamp.forEach(function(metric, timestamp) {
                if (timestamp < cutoff || timestamp > end) {
                    metrics_by_timestamp.delete(timestamp);
                }
            });
        }

        socket.on('startdata', function(payload) {
            if (payload.request_id !== history_request_id) {
                return;
            }
            set_history_retention(payload.retention);
            var recent = Array.from(metrics_by_timestamp.values())
                .filter(metric => history_append || (view_mode === 'live' && metric.ts > payload.end));
            metrics_by_timestamp.clear();
            recent.forEach(merge_metric);
            payload.metrics.forEach(merge_metric);
            history_loaded_end = payload.end;
            history_loading = false;
            trim_history();
            rebuild_datasets();
            chart_dirty = false;
            myChart.update('none');
            document.getElementById('history-status').textContent = '';
        });

        socket.on('history_error', function(payload) {
            if (payload.request_id === history_request_id) {
                history_loading = false;
                history_failed = true;
                document.getElementById('history-status').textContent = payload.message;
            }
        });

        socket.on('value', function(metric) {
            var bounds = visible_bounds();
            if (metric.ts < bounds.start - average_context - 1000 ||
                metric.ts > bounds.end + (view_mode === 'live' ? history_prefetch : 1000)) {
                return;
            }
            if (merge_metric(metric)) {
                chart_dirty = true;
            }
        });

    </script>

    <div id="charts" style="margin: 250px"></div>
  </body>
</html>
